<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet</title>

    https://cdn.tailwindcss.comscript>
</head>

<body class="bg-slate-100 min-h-screen">

    <div class="max-w-md mx-auto p-4">

        <!-- Header -->

        <div class="mb-6">
            <h1 class="text-3xl font-bold text-center text-slate-800">
                My Wallet
            </h1>
            <p class="text-center text-slate-500">
                Offline Personal Finance Tracker
            </p>
        </div>

        <!-- Navigation -->

        <div class="grid grid-cols-3 gap-2 mb-6">

            <button onclick="showTab('dashboard')"
                class="bg-blue-600 text-white py-2 rounded-lg">
                Dashboard
            </button>

            <button onclick="showTab('portfolio')"
                class="bg-green-600 text-white py-2 rounded-lg">
                Portfolio
            </button>

            <button onclick="showTab('expenses')"
                class="bg-purple-600 text-white py-2 rounded-lg">
                Expenses
            </button>

        </div>

        <!-- DASHBOARD -->

        <section id="dashboard">

            <h2 class="text-xl font-bold mb-4">
                Dashboard
            </h2>

            <div class="grid grid-cols-2 gap-3">

                <div class="bg-blue-600 text-white p-4 rounded-xl">
                    <div class="text-sm">
                        Net Worth
                    </div>
                    <div id="netWorth" class="text-xl font-bold">
                        ₹0
                    </div>
                </div>

                <div class="bg-green-600 text-white p-4 rounded-xl">
                    <div class="text-sm">
                        Bank
                    </div>
                    <div id="bankValue" class="text-xl font-bold">
                        ₹0
                    </div>
                </div>

                <div class="bg-violet-600 text-white p-4 rounded-xl">
                    <div class="text-sm">
                        Mutual Fund
                    </div>
                    <div id="mfValue" class="text-xl font-bold">
                        ₹0
                    </div>
                </div>

                <div class="bg-yellow-400 text-black p-4 rounded-xl">
                    <div class="text-sm">
                        Chit Fund
                    </div>
                    <div id="chitValue" class="text-xl font-bold">
                        ₹0
                    </div>
                </div>

                <div class="bg-pink-600 text-white p-4 rounded-xl">
                    <div class="text-sm">
                        Lent Money
                    </div>
                    <div id="lendValue" class="text-xl font-bold">
                        ₹0
                    </div>
                </div>

                <div class="bg-red-600 text-white p-4 rounded-xl">
                    <div class="text-sm">
                        Expenses
                    </div>
                    <div id="expenseValue" class="text-xl font-bold">
                        ₹0
                    </div>
                </div>

            </div>

        </section>

        <!-- PORTFOLIO -->

        <section id="portfolio" class="hidden">

            <h2 class="text-xl font-bold mb-4">
                Portfolio
            </h2>

            <div class="space-y-3">

                <input
                    id="bank"
                    type="number"
                    placeholder="Bank Balance"
                    class="w-full border rounded-lg p-3">

                <input
                    id="mf"
                    type="number"
                    placeholder="Mutual Fund Value"
                    class="w-full border rounded-lg p-3">

                <input
                    id="chit"
                    type="number"
                    placeholder="Chit Fund Value"
                    class="w-full border rounded-lg p-3">

                <input
                    id="lend"
                    type="number"
                    placeholder="Lent Money"
                    class="w-full border rounded-lg p-3">

                <button
                    onclick="Portfolio.save()"
                    class="w-full bg-green-600 text-white p-3 rounded-lg">
                    Save Portfolio
                </button>

            </div>

        </section>

        <!-- EXPENSES -->

        <section id="expenses" class="hidden">

            <h2 class="text-xl font-bold mb-4">
                Expenses
            </h2>

            <input
                id="expenseText"
                placeholder="spent 450 on petrol"
                class="w-full border p-3 rounded-lg">

            <button
                onclick="Expenses.add()"
                class="w-full bg-purple-600 text-white p-3 rounded-lg mt-3">
                Add Expense
            </button>

            <div
                id="expenseList"
                class="mt-4">
            </div>

        </section>

    </div>

    <!-- Scripts -->

    js/storage.jsscript>
    js/portfolio.jsscript>
    js/dashboard.jsscript>
    js/expenses.jsscript>
    js/app.jsscript>

</body>

</html>
