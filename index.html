<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wallet</title>

    https://cdn.tailwindcss.comscript>

    css/styles.css
</head>

<body class="bg-slate-100 min-h-screen">

    <div class="max-w-md mx-auto">

        <!-- Header -->

        <div class="bg-slate-900 text-white p-4 shadow">

            <h1 class="text-2xl font-bold text-center">
                My Wallet
            </h1>

            <p class="text-center text-sm text-slate-300 mt-1">
                Offline Personal Finance Tracker
            </p>

        </div>

        <!-- Navigation -->

        <div class="grid grid-cols-3 gap-2 p-3 bg-white shadow">

            <button
                onclick="loadPage('dashboard')"
                class="bg-blue-600 text-white py-2 rounded-lg">
                Dashboard
            </button>

            <button
                onclick="loadPage('portfolio')"
                class="bg-green-600 text-white py-2 rounded-lg">
                Portfolio
            </button>

            <button
                onclick="loadPage('expenses')"
                class="bg-purple-600 text-white py-2 rounded-lg">
                Expenses
            </button>

        </div>

        <!-- Content Area -->

        <main
            id="content"
            class="p-4">
        </main>

    </div>

    <!-- Scripts -->

    js/storage.jsscript>
    js/dashboard.jsscript>
    js/portfolio.jsscript>
    js/expenses.jsscript>
    js/app.jsscript>

</body>
</html>
