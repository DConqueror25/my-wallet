<!DOCTYPE html>
<html>
<head>
    <title>Finance Tracker</title>

    https://cdn.tailwindcss.comscript>
</head>
<body>

    <div id="app">

        <button onclick="showTab('dashboard')">
            Dashboard
        </button>

        <button onclick="showTab('portfolio')">
            Portfolio
        </button>

        <button onclick="showTab('expenses')">
            Expenses
        </button>

        <div id="dashboard">
            Dashboard Content
        </div>

        <div id="portfolio" style="display:none">
            Portfolio Content
        </div>

        <div id="expenses" style="display:none">
            Expense Content
        </div>

    </div>

    js/storage.jsscript>
    js/utils.jsscript>
    js/dashboard.jsscript>
    js/portfolio.jsscript>
    js/expenses.jsscript>
    js/app.jsscript>

</body>
</html>
